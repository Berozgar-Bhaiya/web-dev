<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Business / Profile Card</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="container">
            <div id="card">
                <div id="topSection">
                    <div id="profilephoto"></div>
                    <h1 id="name">Jamie Dawson</h1>
                    <p id="title">Front-end Developer</p>
                    <section id="locationSection">
                        <img id="mapIcon" src="../icons/map-pin.svg" alt="" />
                        <span id="location">Hyderabad, India</span>
                    </section>
                    <p id="bio">
                        Building small, fast websites and learning something new
                        every week.
                    </p>
                </div>
                <div id="btns">
                    <section>
                        <button>
                            <img src="../icons/github.svg" alt="github icon" />
                            <a href="https://www.github.com" target="_blank"
                                >GitHub</a
                            >
                        </button>
                    </section>
                    <section>
                        <button>
                            <img
                                src="../icons/linkedin.svg"
                                alt="linkedln icon"
                            />
                            <a href="https://www.linkedin.com">Linkedin</a>
                        </button>
                    </section>
                    <section>
                        <button>
                            <img src="../icons/mail.svg" alt="mail icon" />
                            <a href="mailtoabc@gmail.com">Email me</a>
                        </button>
                    </section>
                </div>
            </div>
        </div>
    </body>
</html>
